# How teleport describes itself to the gateway's module catalogue (spec 035).
# Each v* release publishes catalogue-entry.json and bundle.zip built from
# this file and deploy/bundle/ (see .github/workflows/ci.yaml, job catalogue).
schema: 1
module: teleport
display_name: Teleport
category: Access
summary: Teleport Community Edition cluster management - registration and health, users, roles, locks, join tokens, enrolled resources, audit search and alerts, provisioning and a deployment wizard.
image: ghcr.io/go-tangra/go-tangra-teleport
routes:
  prefixes: [/api/teleport, /m/teleport, /teleport]
  names: [teleport]
min_core: { gateway: 4.9.0, auth: 4.10.0 }
bundle:
  dir: deploy/bundle
  templates: [config.yaml, policy.yaml]
  tls_hosts: [teleport-db]
host_inputs:
  - key: MODULE_ADVERTISE_HOST
    label: Host name the core uses to reach this module
    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'
  - key: MODULE_BIND_IP
    label: IP address the module's mesh ports listen on (reachable from the core)
    pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$'
  # The platform event bus is the core's Valkey (TLS); it is also where the
  # watcher leases and the Teleport read cache live. Not part of the bundle.
  - key: VALKEY_ADDRESS
    label: Core event bus (Valkey, TLS) as host:port, reachable from this host
    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*:[1-9][0-9]{0,4}$'
  - key: VALKEY_PASSWORD
    label: Password of the core event bus user "teleport"
    pattern: '^[A-Za-z0-9._~+/=-]{16,128}$'
  - key: VALKEY_CA_FILE
    label: Host file of the CA certificate (PEM) of the core event bus (mounted read-only)
    pattern: '^/[A-Za-z0-9._/-]{0,254}$'
  - key: WARDEN_GRPC
    label: Warden module gRPC address reachable from this host (host:port)
    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*:[1-9][0-9]{0,4}$'
  - key: NOTIFICATION_GRPC
    label: Notification module gRPC address reachable from this host (host:port)
    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*:[1-9][0-9]{0,4}$'
  - key: SCHEDULER_GRPC
    label: Scheduler module gRPC address reachable from this host (host:port)
    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*:[1-9][0-9]{0,4}$'
docs: https://github.com/go-tangra/go-tangra-teleport#readme
