# Freya service-to-service policy for teleport (rendered for this core's
# trust domain; contracts/grpc.md): deny by default. The gateway forwards
# browser traffic only; inventory, asset and portal may read Teleport
# reachability; the scheduler alone runs the module's periodic tasks.
version: teleport-join-1
rules:
  - id: gateway-forwards
    from: ["spiffe://${TRUST_DOMAIN}/svc/gateway"]
    to: ["teleport"]
    operations: ["GET *", "HEAD *", "POST *", "PUT *", "PATCH *", "DELETE *", "OPTIONS *"]
    effect: allow
  - id: modules-access
    from: ["spiffe://${TRUST_DOMAIN}/svc/inventory", "spiffe://${TRUST_DOMAIN}/svc/asset", "spiffe://${TRUST_DOMAIN}/svc/portal"]
    to: ["teleport"]
    operations: ["/teleport.v1.Access/LookupHost", "/teleport.v1.Access/GetLinks", "/grpc.health.v1.Health/Check"]
    effect: allow
  - id: scheduler-tasks
    from: ["spiffe://${TRUST_DOMAIN}/svc/scheduler"]
    to: ["teleport"]
    operations: ["/scheduler.v1.TaskExecutor/ExecuteTask"]
    effect: allow
