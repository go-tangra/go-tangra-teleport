# teleport configuration, rendered by the gateway's add-module wizard: every
# ${...} below was filled from the core's own configuration, generated for
# this bundle, or given in the wizard.
service_name: teleport
trust_domain: ${TRUST_DOMAIN}
# Not "production": production mode refuses file: credential references, and
# warden has no write RPC yet (research D11), so a newly registered cluster's
# management identity is kept as a file in the teleport-state volume. Every
# other production guard is met explicitly below (verified TLS to the
# database and the core's Valkey, verified enrolment, no private-network
# opt-out).
env: dev
identity:
  provider: provided
mesh_enroll:
  enabled: true
  enroll_url: ${LCM_ENROLL_URL}
  lcm_grpc: ${LCM_GRPC}
  tenant_id: ${MESH_TENANT_ID}
  token_file: /tokens/enrollment.token
  state_file: /state/svid.json
  insecure: false
authz: { source: file, path: /app/policy.yaml }
server: { grpc_addr: 0.0.0.0:9925, http_addr: 0.0.0.0:9926 }
admin: { addr: 127.0.0.1:9870 }
discovery:
  static:
    gateway: ["${GATEWAY_GRPC}"]
    auth: ["${AUTH_GRPC}"]
    lcm: ["${LCM_GRPC}"]
    warden: ["${WARDEN_GRPC}"]
    notification: ["${NOTIFICATION_GRPC}"]
    scheduler: ["${SCHEDULER_GRPC}"]
db:
  dsn: postgres://teleport_app:${GEN_PASSWORD_2}@teleport-db:5432/teleport?sslmode=verify-full&sslrootcert=/tls/ca.pem
  migrate_dsn: postgres://postgres:${GEN_PASSWORD_1}@teleport-db:5432/teleport?sslmode=verify-full&sslrootcert=/tls/ca.pem
  max_conns: 16
# The core's event bus: teleport.* events go to platform:events:<tenant>,
# which the gateway fans out to signed-in browsers; leases and the read
# cache share the connection.
valkey:
  addresses: ["${VALKEY_ADDRESS}"]
  username: teleport
  password: "${VALKEY_PASSWORD}"
  allow_plaintext: false
  ca_file: /tls/valkey-ca.pem
events: { enabled: true }
secrets:
  warden_service: warden
  allow_file: true
  file_dir: /state/credentials
gateway: { service: gateway, issuer: ${GATEWAY_ISSUER} }
task_scheduler: { enabled: true, service: scheduler }
teleport:
  # Empty: private, loopback and link-local cluster addresses are refused.
  # Add RFC 1918 prefixes here for lab clusters (logged at start).
  allowed_private_networks: []
  allowed_ports: [443, 3080]
  call_timeout_seconds: 10
  max_message_bytes: 4194304
  max_concurrent_per_cluster: 4
  cache_ttl_seconds: 15
  probe_timeout_seconds: 5
thresholds:
  credential_warn_days: 7
  unreachable_after_failures: 3
  offline_minutes: 15
  deprovision_grace_days: 7
limits_teleport: { max_request_bytes: 1048576, max_upload_bytes: 65536, max_page_size: 200 }
