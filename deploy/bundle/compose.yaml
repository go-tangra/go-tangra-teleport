# teleport join bundle, rendered by the gateway's add-module wizard.
#   docker compose up -d
# Values come from .env (written by the gateway: core addresses, generated
# passwords and the host inputs you gave). private/ holds the single-use
# enrolment token, the mesh CA and this bundle's own TLS material.
name: tangra-teleport
services:
  teleport-db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: teleport
      POSTGRES_PASSWORD: ${GEN_PASSWORD_1}
      TELEPORT_APP_PASSWORD: ${GEN_PASSWORD_2}
    # The server key must belong to the postgres user: copy it before start.
    entrypoint: ["sh", "-c", "install -d -o postgres -m 0700 /tls-pg && install -o postgres -m 0600 /tls/teleport-db.key /tls-pg/server.key && install -o postgres -m 0644 /tls/teleport-db.crt /tls-pg/server.crt && exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls-pg/server.crt", "-c", "ssl_key_file=/tls-pg/server.key"]
    volumes:
      - teleport-db:/var/lib/postgresql/data
      - ./private/tls:/tls:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teleport"]
      interval: 5s
      retries: 30
  teleport:
    image: ${MODULE_IMAGE}:${MODULE_VERSION}
    restart: unless-stopped
    # The image's non-root user. It dials the managed Teleport clusters on
    # their proxy port (443/3080) through the netguard SSRF guard.
    user: "10001:10001"
    command: ["-config", "/app/config.yaml"]
    environment:
      FREYA_ADVERTISE_HOST: ${MODULE_ADVERTISE_HOST}
    ports:
      - "${MODULE_BIND_IP}:9925:9925"
      - "${MODULE_BIND_IP}:9926:9926"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./policy.yaml:/app/policy.yaml:ro
      - ./private/enrollment.token:/tokens/enrollment.token:ro
      - ./private/tls/ca.pem:/tls/ca.pem:ro
      - ${VALKEY_CA_FILE}:/tls/valkey-ca.pem:ro
      - teleport-state:/state
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9870/readyz"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      teleport-db: { condition: service_healthy }
volumes:
  teleport-db: {}
  teleport-state: {}
