# Teleport configuration for tp.example.test, generated by the tangra deployment
# wizard (equivalent to: teleport configure --acme --acme-email=ops@example.test --cluster-name=tp.example.test).
# Install it as /etc/teleport.yaml; install.sh does that for you.
version: v3
teleport:
  nodename: "tp.example.test"
  data_dir: /var/lib/teleport
  log:
    output: stderr
    severity: INFO
    format:
      output: text
auth_service:
  enabled: "yes"
  listen_addr: 0.0.0.0:3025
  cluster_name: "tp.example.test"
  proxy_listener_mode: multiplex
  authentication:
    type: local
    second_factor: "on"
    webauthn:
      rp_id: "tp.example.test"
ssh_service:
  enabled: "yes"
proxy_service:
  enabled: "yes"
  web_listen_addr: 0.0.0.0:443
  public_addr: "tp.example.test:443"
  acme:
    enabled: "yes"
    email: "ops@example.test"
