# Teleport configuration for teleport.corp.example, generated by the tangra deployment
# wizard (equivalent to: teleport configure --cluster-name=teleport.corp.example).
# Install it as /etc/teleport.yaml; install.sh does that for you.
version: v3
teleport:
  nodename: "teleport.corp.example"
  data_dir: /var/lib/teleport
  log:
    output: stderr
    severity: INFO
    format:
      output: text
auth_service:
  enabled: "yes"
  listen_addr: 0.0.0.0:3025
  cluster_name: "teleport.corp.example"
  proxy_listener_mode: multiplex
  authentication:
    type: local
    second_factor: "on"
    webauthn:
      rp_id: "teleport.corp.example"
ssh_service:
  enabled: "yes"
proxy_service:
  enabled: "yes"
  web_listen_addr: 0.0.0.0:443
  public_addr: "teleport.corp.example:443"
  https_keypairs:
    - key_file: /etc/teleport/tls/privkey.pem
      cert_file: /etc/teleport/tls/fullchain.pem
  https_keypairs_reload_interval: 1h
