# go-tangra-teleport CI (go-tangra v4), modelled on go-tangra-dns.
#
# Images: ghcr.io/go-tangra/go-tangra-teleport tagged <version>, <major>.<minor>, <major> (from tags vX.Y.Z)
# and sha-<short> (default-branch pushes and tags). There is deliberately NO `latest`
# and NO branch tag.
#
# SDK releases: this repository has no sdk/ module (the typed client is pkg/teleportclient).
# The tag filter 'v*' is a glob anchored at the start of the tag name (`*` does not
# cross `/`), so `sdk/v4.0.0` never matches it and never builds or pushes an image.
name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: 'off'
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/go-tangra/go-tangra-teleport

jobs:
  go:
    name: Go gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum

      # Help pages (docs/help): front-matter, slugs, links, images, limits.
      - name: Lint help pages
        uses: go-tangra/go-tangra/.github/actions/docs-lint@v4.10.0
        with:
          tool-version: v4.10.0

      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))" || { gofmt -l $(git ls-files '*.go'); exit 1; }

      # Principle VI: no AGPL Teleport module in the module or import graph.
      - name: License check
        run: make license

      - name: go vet (service, and the integration-tagged suites)
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: staticcheck and gosec
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
          staticcheck ./...
          gosec -quiet -exclude-generated -exclude-dir=ui ./...

      - name: go test -race
        run: make test

      # >= 80% overall, 100% for authz/, netguard/, secrets/.
      - name: Coverage gate
        run: make cover

      # SC-007: no credential, join token or invite link in captured output.
      - name: Redaction scan
        run: make redaction-scan

      - name: govulncheck
        run: make vuln

  integration:
    name: Integration (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum

      # TimescaleDB, Valkey and Teleport CE containers (pin TELEPORT_IT_IMAGE by digest).
      - name: go test -tags integration
        run: make test-integration
        env:
          TELEPORT_IT_IMAGE: public.ecr.aws/gravitational/teleport-distroless:18

  ui:
    name: UI lint + unit tests + build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@go-tangra'

      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build (federated remote)
        run: npm run build

  buf:
    name: Buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}

      - name: buf lint
        run: buf lint

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs:
      - go
      - integration
      - ui
      - buf
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build (push on tags and main pushes only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}

  # Module catalogue entry (spec 035): on a release tag, publish
  # catalogue-entry.json and bundle.zip (tangra-module.yaml, deploy/bundle/)
  # with a GitHub artifact attestation, so gateways can list and install this
  # release. Runs after the image is pushed: the action checks it is pullable.
  catalogue:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: go-tangra/go-tangra/.github/actions/catalogue-entry@v4.10.0
        with:
          tool-version: v4.10.0
          permissions-command: go run ./cmd/teleport-catalogue-permissions
